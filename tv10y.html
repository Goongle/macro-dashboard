<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>미국 10Y 금리</title><style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Arial,sans-serif}
.card{height:100%;display:flex;flex-direction:column;border:1px solid #e5e7eb;background:#fff}
.clip{position:relative;overflow:hidden}
.scale{position:absolute;top:0;left:0;transform-origin:0 0}
.quote-clip{flex:0 0 72px;border-bottom:1px solid #f1f3f5}
.quote-scale{width:340px;height:112px}
.chart-clip{flex:1;min-height:100px}
.chart-scale{width:250px;height:100%}
.scale>div,.scale>div>div{width:100%;height:100%}
</style></head><body>
<div class="card">
<div class="clip quote-clip" id="qc"><div class="scale quote-scale" id="qs">
<div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div>
<script src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>{"symbol":"FRED:DGS10","width":"100%","isTransparent":true,"colorTheme":"light","locale":"kr"}</script>
</div></div></div>
<div class="clip chart-clip" id="cc"><div class="scale chart-scale" id="cs">
<div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div>
<script src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>{"autosize":true,"symbol":"FRED:DGS10","interval":"D","timezone":"Asia/Seoul","theme":"light","style":"2","locale":"kr","backgroundColor":"rgba(255, 255, 255, 1)","gridColor":"rgba(240, 243, 250, 0.35)","hide_top_toolbar":true,"hide_side_toolbar":true,"hide_legend":true,"save_image":false,"calendar":false,"hide_volume":true,"support_host":"https://www.tradingview.com"}</script>
</div></div></div>
</div>
<script>
function fit(){
  var qc=document.getElementById('qc'),qs=document.getElementById('qs');
  var q=Math.min(1,qc.clientWidth/340);
  qs.style.transform='scale('+q+')';
  qc.style.flexBasis=Math.ceil(112*q)+'px';
  var cc=document.getElementById('cc'),cs=document.getElementById('cs');
  var c=Math.min(1,cc.clientWidth/250);
  cs.style.transform='scale('+c+')';
  // 축소한 만큼 내부 높이를 키워야 세로가 카드에 꽉 찬다
  cs.style.height=Math.ceil(cc.clientHeight/c)+'px';
}
fit();
addEventListener('resize',fit);
// 위젯이 늦게 뜨면 컨테이너 크기가 바뀌므로 한 번 더 맞춘다
addEventListener('load',fit);
setTimeout(fit,1200);
</script></body></html>
