<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Macro Dashboard</title><style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:#fff;font-family:Arial,sans-serif}
body{padding:4px}
.grid{height:100vh;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
grid-template-rows:repeat(3,minmax(0,1fr));gap:6px}
.cell{min-width:0;min-height:0;display:flex;flex-direction:column}
.cell h2{margin:0 0 3px;font-size:12px;font-weight:700;color:#374151;white-space:nowrap}
.cell iframe{flex:1;width:100%;border:0}
@media(max-width:600px){
html,body{height:auto}
.grid{height:auto;grid-template-columns:1fr;grid-template-rows:none}
.cell{height:240px}
}
</style></head><body><div class="grid">
<div class="cell"><h2>S&P 500</h2><iframe src="sp500.html" title="S&P 500"></iframe></div>
<div class="cell"><h2>NASDAQ 100</h2><iframe src="nasdaq.html" title="NASDAQ 100"></iframe></div>
<div class="cell"><h2>미국 2Y 금리</h2><iframe src="tv2y.html" title="미국 2Y 금리"></iframe></div>
<div class="cell"><h2>미국 10Y 금리</h2><iframe src="tv10y.html" title="미국 10Y 금리"></iframe></div>
<div class="cell"><h2>금</h2><iframe src="gold.html" title="금"></iframe></div>
<div class="cell"><h2>은</h2><iframe src="silver.html" title="은"></iframe></div>
<div class="cell"><h2>WTI 원유</h2><iframe src="wti.html" title="WTI 원유"></iframe></div>
<div class="cell"><h2>달러 인덱스</h2><iframe src="dxy.html" title="달러 인덱스"></iframe></div>
<div class="cell"><h2>USD/KRW</h2><iframe src="usdkrw.html" title="USD/KRW"></iframe></div>
</div></body></html>
